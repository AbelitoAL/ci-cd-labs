name: Primer Pipeline CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  hello-ci:
    name: Hello CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostrar información del entorno
        run: |
          echo "==================================="
          echo "         PRIMER PIPELINE CI"
          echo "==================================="
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "==================================="

      - name: Mostrar fecha y hora
        run: date

      - name: Mostrar versión de Git
        run: git --version

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicacion (build)
        run: npm run build

      - name: Ejecutar pruebas unitarias (con cobertura)
        run: npm test

      - name: Publicar reporte de pruebas (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Finalizar pipeline
        run: echo "Pipeline ejecutado correctamente."

      - name: Mostrar mensaje de éxito
        run: echo "¡Pipeline completado con éxito!"
        